[workspace]
authors = ["Jacob Williams <jacobwilliams@users.noreply.github.com>"]
channels = ["conda-forge"]
name = "wxfortran"
platforms = ["osx-arm64", "osx-64", "linux-64", "linux-aarch64"]
version = "0.0.1"

[dependencies]
gfortran = "15.*"
fpm = ">=0.13.0,<0.14"
python = "3.13.*"
wxwidgets = "3.3.*"
# C++ compiler for the shim
cxx-compiler = ">=2.0.0,<3"

[target.unix.dependencies]
pkg-config = ">=0.29.2,<0.30"

[tasks]
build = "python tools/fpm_wx.py build"
test = "python tools/fpm_wx.py test"
# examples run as release builds with OpenMP (used by mandelbrot; the others
# are unaffected). `pixi run build` builds them in debug, without OpenMP: serial.
example = "python tools/fpm_wx.py run --profile release --openmp --example"
lint = "python tools/check_fortran.py"
# build and run ci/consumer, a separate fpm project that depends on wxFortran
consumer = { cmd = "python ../../tools/fpm_wx.py run", cwd = "ci/consumer" }
