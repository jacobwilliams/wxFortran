name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Windows is not supported yet: conda-forge's wxWidgets is MSVC-built
        # (see README, "Platform support").
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: prefix-dev/setup-pixi@v0.11.2
        with:
          cache: true

      # GUI tests on Linux run on a virtual X display (tools/fpm_wx.py uses xvfb-run)
      - name: Install Xvfb
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y xvfb

      - name: Docstrings and implicit none
        if: runner.os == 'Linux'
        run: pixi run lint

      - name: API documentation (FORD)
        if: runner.os == 'Linux'
        run: pixi run doc

      - name: Build library and examples
        run: pixi run build

      - name: Test
        run: pixi run test

      # the way `pixi run example` builds: optimized, with OpenMP
      - name: Build with OpenMP (release)
        run: pixi run python tools/fpm_wx.py build --openmp

      - name: Use wxFortran from another fpm project
        run: pixi run consumer
