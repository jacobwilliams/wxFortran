name = "wxfortran"
version = "0.0.1"
license = "MIT"
author = "Jacob Williams"
maintainer = "Jacob Williams"
description = "Modern Fortran interface to wxWidgets"
keywords = ["wxwidgets", "gui"]

[build]
auto-executables = true
auto-tests = true
auto-examples = true
module-naming = false
# The C++ shim in src/shim is compiled by fpm. The C++ compiler, wxWidgets
# include flags and libraries come from FPM_CXX / FPM_CXXFLAGS / FPM_LDFLAGS
# (from `wx-config`): see tools/fpm_wx.py and the README.

# OpenMP (fpm metapackage): used by example/mandelbrot.f90; the library
# itself has no OpenMP code.
[dependencies]
openmp = "*"

[fortran]
implicit-typing = false
implicit-external = false
source-form = "free"

# The C++ runtime the shim needs.
[features]
default.macos.link-time-flags = "-lc++"
default.linux.link-time-flags = "-lstdc++"
